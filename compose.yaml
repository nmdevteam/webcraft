services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webcraft}
      POSTGRES_USER: ${POSTGRES_USER:-webcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run `pnpm setup` to create .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webcraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webcraft} -d ${POSTGRES_DB:-webcraft}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  webcraft-postgres:
